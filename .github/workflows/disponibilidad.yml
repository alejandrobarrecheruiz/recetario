name: Disponibilidad
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: disponibilidad
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar web y MongoDB
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 --output /dev/null https://recetario-36ok.vercel.app/
          curl --fail --silent --show-error --max-time 30 --retry 2 --output /dev/null https://recetario-36ok.vercel.app/api/salud
