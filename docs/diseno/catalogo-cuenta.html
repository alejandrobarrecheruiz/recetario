<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Catálogo y cuenta · Comparativa</title>
  <link rel="stylesheet" href="catalogo-cuenta.css">
</head>
<body class="comparador">
  <header class="barra-comparador">
    <div><strong>Catálogo y cuenta</strong><small>Propuestas · contenido de muestra · sin conexión a tu cuenta</small></div>
    <nav aria-label="Propuesta"><button data-vista="visual" aria-pressed="false">01 · Tira visual</button><button data-vista="selector" aria-pressed="true">02 · Selector</button><button data-vista="cuenta" aria-pressed="false">03 · Cuenta</button></nav>
    <a id="sin-marco" href="catalogo-cuenta-vista.html?vista=selector" target="_blank" rel="noopener">Sin marco ↗</a>
  </header>
  <section class="herramientas" aria-label="Opciones de comparación">
    <p id="criterio">La categoría elegida queda a la vista; el resto se abre al pulsar el selector.</p>
    <div class="anchos"><button data-ancho="desktop" aria-pressed="true">Escritorio</button><button data-ancho="390" aria-pressed="false">390 px</button><button data-ancho="320" aria-pressed="false">320 px</button></div>
    <button id="estado-vacio" aria-pressed="false" hidden>Sin guardadas</button>
  </section>
  <main class="escenario" data-ancho="desktop"><iframe src="catalogo-cuenta-vista.html?vista=selector" title="Propuesta 02: selector de categorías"></iframe></main>
  <script>
    let vista = 'selector';
    let vacia = false;
    const textos = {visual:'Categorías con ilustraciones y nombres. Desliza la tira en móvil; las recetas siguen siendo el contenido principal.',selector:'La categoría elegida queda a la vista; el resto se abre al pulsar el selector.',cuenta:'Identidad arriba, guardadas como contenido y ajustes tras el engranaje. Prueba también el estado sin guardadas.'};
    function actualizar() {
      const ruta = 'catalogo-cuenta-vista.html?vista=' + vista + (vacia ? '&vacia=1' : '');
      document.querySelector('iframe').src = ruta;
      document.querySelector('iframe').title = 'Propuesta de ' + (vista === 'cuenta' ? 'cuenta' : 'catálogo: ' + vista);
      document.querySelector('#sin-marco').href = ruta;
      document.querySelector('#criterio').textContent = textos[vista];
      document.querySelector('#estado-vacio').hidden = vista !== 'cuenta';
      document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.vista === vista)));
    }
    document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click',()=>{vista=b.dataset.vista;actualizar();}));
    document.querySelectorAll('button[data-ancho]').forEach(b => b.addEventListener('click',()=>{
      document.querySelector('.escenario').dataset.ancho=b.dataset.ancho;
      document.querySelectorAll('button[data-ancho]').forEach(otro=>otro.setAttribute('aria-pressed',String(otro===b)));
    }));
    document.querySelector('#estado-vacio').addEventListener('click',e=>{vacia=!vacia;e.currentTarget.setAttribute('aria-pressed',String(vacia));actualizar();});
  </script>
</body>
</html>
