<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Propuesta 04 · Ficha de receta</title>
  <style>
    @font-face{font-family:Instrument;src:url('assets/instrument-sans-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#cfd9dd;color:#0f1418;font:14px/1.4 Instrument,system-ui,sans-serif}.barra{padding:14px 24px;background:#fff;border-bottom:1px solid #c0ccd1;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.marca{margin-right:auto}.marca strong{font-size:16px;font-weight:600}.marca small{display:block;color:#536167;margin-top:2px}.opciones{display:flex;gap:5px;flex-wrap:wrap}button,a{font:inherit;color:inherit;min-height:44px;padding:8px 13px;display:inline-flex;align-items:center;justify-content:center}button{border:1px solid #c0ccd1;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#0f1418;color:white;border-color:#0f1418}a{text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid #b33420;outline-offset:3px}.criterio{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.criterio p{margin:0;max-width:80ch}.criterio strong{font-weight:600}.tamanos{display:flex;gap:4px;flex-shrink:0}.tamanos button{font-size:12px}.escenario{padding:0 18px 18px;display:flex;justify-content:center}iframe{display:block;border:1px solid #c0ccd1;background:white;width:100%;height:calc(100dvh - 170px);min-height:550px}.escenario[data-ancho="390"] iframe{width:390px;max-width:100%}.escenario[data-ancho="320"] iframe{width:320px;max-width:100%}@media(max-width:760px){.barra{padding:12px;gap:10px}.marca{width:100%}.opciones{flex:1}.opciones button{flex:1;padding:8px;font-size:12px}.criterio{padding:12px;align-items:start;flex-direction:column;gap:10px}.escenario{padding:0 8px 8px}iframe{height:75dvh}.barra>a{display:none}}
  </style>
</head>
<body>
  <header class="barra">
    <div class="marca"><strong>La ficha · propuesta 04</strong><small>Comparativa visual · sin cambios en la aplicación</small></div>
    <nav class="opciones" aria-label="Propuestas">
      <button data-propuesta="1" aria-pressed="false">01 · Enfrentada</button>
      <button data-propuesta="2" aria-pressed="false">02 · Acompañada</button>
      <button data-propuesta="3" aria-pressed="false">03 · Panorámica</button>
      <button data-propuesta="4" aria-pressed="true">04 · Combinada</button>
    </nav>
    <a id="abrir" href="ficha-propuestas.html?propuesta=4" target="_blank" rel="noopener">Sin marco ↗</a>
  </header>
  <section class="criterio" aria-label="Qué comparar">
    <p id="criterio"><strong>04 · Foto a la derecha.</strong> Introducción e ingredientes juntos; pasos sin rótulo ni línea de separación y una nota final en cursiva, más abajo.</p>
    <div class="tamanos" aria-label="Ancho de la vista">
      <button data-ancho="desktop" aria-pressed="true">Escritorio</button>
      <button data-ancho="390" aria-pressed="false">390 px</button>
      <button data-ancho="320" aria-pressed="false">320 px</button>
    </div>
  </section>
  <main class="escenario" data-ancho="desktop"><iframe title="Propuesta 04: introducción e ingredientes junto a la foto" src="ficha-propuestas.html?propuesta=4"></iframe></main>
  <script>
    const descripciones = {
      1: ['Equilibrio al entrar.', 'Foto y título comparten la primera pantalla; debajo, ingredientes y pasos siguen un recorrido vertical.'],
      2: ['La foto ocupa el margen.', 'En escritorio acompaña la lectura sin moverse. Ingredientes y pasos permanecen en la misma columna.'],
      3: ['Más horizontal, menos aire.', 'Foto panorámica, cabecera superpuesta sobre blanco e ingredientes en una franja compacta. Mayor recorte de la imagen.'],
      4: ['Foto a la derecha.', 'Introducción e ingredientes juntos; pasos sin rótulo ni línea de separación y una nota final en cursiva, más abajo.']
    };
    document.querySelectorAll('[data-propuesta]').forEach(boton => boton.addEventListener('click', () => {
      const numero = boton.dataset.propuesta;
      document.querySelectorAll('[data-propuesta]').forEach(otro => otro.setAttribute('aria-pressed', String(otro === boton)));
      const ruta = 'ficha-propuestas.html?propuesta=' + numero;
      const vista = document.querySelector('iframe');
      vista.src = ruta;
      vista.title = 'Propuesta 0' + numero + ': ' + boton.textContent.split(' · ')[1];
      document.querySelector('#abrir').href = ruta;
      const criterio = document.querySelector('#criterio');
      criterio.replaceChildren();
      const titulo = document.createElement('strong');
      titulo.textContent = '0' + numero + ' · ' + descripciones[numero][0] + ' ';
      criterio.append(titulo, descripciones[numero][1]);
    }));
    document.querySelectorAll('button[data-ancho]').forEach(boton => boton.addEventListener('click', () => {
      document.querySelector('.escenario').dataset.ancho = boton.dataset.ancho;
      document.querySelectorAll('button[data-ancho]').forEach(otro => otro.setAttribute('aria-pressed', String(otro === boton)));
    }));
  </script>
</body>
</html>
